{% extends "base.html" %}
{% block content %}
<h2>Transfer Money</h2>
<div class="card p-4 mt-3 col-md-8">
    <form method="POST">
        <div class="mb-3">
            <label>Select Your Card (Sender)</label>
            <select name="sender_card" class="form-select">
                {% for c in cards %}
                <option value="{{ c['card_number'] }}">{{ c['card_name'] }} - {{ c['currency'] }} ({{ c['card_number'][-4:] }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label>Receiver Card Number</label>
            <input type="text" name="receiver_card" class="form-control" placeholder="16-digit number" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Amount</label>
                <input type="number" name="amount" step="0.01" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Your PIN</label>
                <input type="password" name="pin" class="form-control" required>
            </div>
        </div>
        <button class="btn btn-success w-100">Send Money</button>
    </form>
</div>
{% endblock %}
