{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="fw-bold"><i class="fas fa-paper-plane text-primary me-2"></i>Send Money</h2>
            <p class="text-muted">Transfers over 5000 incur a small fee on the excess amount.</p>
        </div>
    </div>

    <form method="POST" action="{{ url_for('transfer') }}" id="transferForm">
        <div class="row g-4">
            
            <div class="col-lg-5">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body p-4">
                        <label class="form-label fw-bold text-secondary small">PAY FROM</label>
                        <select name="sender_card" id="senderCardSelect" class="form-select form-select-lg mb-3" onchange="updateUI()">
                            {% for card in cards %}
                            <option value="{{ card.card_number }}" 
                                    data-balance="{{ card.balance }}" 
                                    data-limit="{{ card.expense_limit }}"
                                    data-currency="{{ card.currency }}">
                                {{ card.card_type }} ****{{ card.card_number[-4:] }}
                            </option>
                            {% endfor %}
                        </select>

                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Available Balance:</span>
                            <span class="fw-bold text-dark" id="balDisplay">0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Card Limit:</span>
                            <span class="fw-bold text-dark" id="limitTotalDisplay">0.00</span>
                        </div>

                        <hr>

                        <label class="form-label fw-bold text-secondary small mt-2">LIMIT REMAINING</label>
                        <div class="progress" style="height: 10px;">
                            <div id="limitBar" class="progress-bar bg-success" role="progressbar" style="width: 100%"></div>
                        </div>
                        <div class="text-end mt-1">
                            <small id="limitRemainingText" class="fw-bold text-success">Select a card</small>
                        </div>

                        <div class="mt-4">
                            <label class="form-label fw-bold">Enter PIN</label>
                            <input type="password" name="pin" class="form-control form-control-lg" placeholder="****" maxlength="4" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body p-4">
                        <label class="form-label fw-bold text-secondary small">RECIPIENT CARD</label>
                        <input type="text" name="receiver_card" class="form-control form-control-lg mb-4" placeholder="0000 0000 0000 0000" required>

                        <label class="form-label fw-bold text-secondary small">AMOUNT</label>
                        <div class="input-group input-group-lg mb-2">
                            <input type="number" id="amountInput" name="amount" class="form-control fw-bold" placeholder="0.00" step="0.01" onkeyup="updateUI()" onchange="updateUI()" required>
                            <span class="input-group-text fw-bold" id="currencyLabel">AZN</span>
                        </div>

                        <div id="limitAlert" class="alert alert-danger d-none mt-3">
                            <i class="fas fa-hand-paper me-2"></i> Amount exceeds card limit!
                        </div>

                        <div id="feeAlert" class="alert alert-warning d-none mt-3">
                            <div class="d-flex justify-content-between">
                                <span><i class="fas fa-info-circle me-2"></i> Fee (Excess > 5000):</span>
                                <span class="fw-bold" id="feeDisplay">0.00</span>
                            </div>
                        </div>

                        <div class="bg-light rounded p-3 mt-4">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Send Amount:</span>
                                <span class="fw-bold" id="summaryAmount">0.00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Fee:</span>
                                <span class="fw-bold text-danger" id="summaryFee">0.00</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="fw-bold h5 mb-0">Total Deduction:</span>
                                <span class="fw-bold h4 text-primary mb-0" id="summaryTotal">0.00</span>
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100 mt-4 fw-bold">Confirm Transfer</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() { updateUI(); });

    function updateUI() {
        // Elements
        const select = document.getElementById('senderCardSelect');
        const amountInput = document.getElementById('amountInput');
        
        // Data
        const selectedOption = select.options[select.selectedIndex];
        const cardLimit = parseFloat(selectedOption.getAttribute('data-limit')) || 5000;
        const cardBal = parseFloat(selectedOption.getAttribute('data-balance')) || 0;
        const curr = selectedOption.getAttribute('data-currency') || 'AZN';
        
        // User Input
        let amount = parseFloat(amountInput.value);
        if(isNaN(amount) || amount < 0) amount = 0;

        // --- 1. CALCULATE FEE (Excess Logic) ---
        let fee = 0;
        if (amount > 5000) {
            let excess = amount - 5000;
            // 2% of excess, minimum 1.0
            fee = Math.max(excess * 0.02, 1.0);
            
            document.getElementById('feeDisplay').innerText = `+${fee.toFixed(2)} ${curr}`;
            document.getElementById('feeAlert').classList.remove('d-none');
        } else {
            document.getElementById('feeAlert').classList.add('d-none');
        }

        let total = amount + fee;

        // --- 2. UPDATE LABELS ---
        document.getElementById('balDisplay').innerText = `${cardBal.toFixed(2)} ${curr}`;
        document.getElementById('limitTotalDisplay').innerText = `${cardLimit.toFixed(2)} ${curr}`;
        document.getElementById('currencyLabel').innerText = curr;
        
        document.getElementById('summaryAmount').innerText = amount.toFixed(2);
        document.getElementById('summaryFee').innerText = fee.toFixed(2);
        document.getElementById('summaryTotal').innerText = `${total.toFixed(2)} ${curr}`;

        // --- 3. LIMIT CHECK VISUALS ---
        const limitAlert = document.getElementById('limitAlert');
        const limitBar = document.getElementById('limitBar');
        const limitText = document.getElementById('limitRemainingText');
        const submitBtn = document.getElementById('submitBtn');
        
        let remaining = cardLimit - amount;
        let percentUsed = (amount / cardLimit) * 100;
        if (percentUsed > 100) percentUsed = 100;
        
        limitBar.style.width = (100 - percentUsed) + "%"; // Show remaining bar

        if (amount > cardLimit) {
            // Over Limit
            limitAlert.classList.remove('d-none');
            limitText.innerText = `Exceeds limit by ${Math.abs(remaining).toFixed(2)} ${curr}`;
            limitText.className = "fw-bold text-danger";
            limitBar.className = "progress-bar bg-danger";
            submitBtn.disabled = true;
        } else {
            // Within Limit
            limitAlert.classList.add('d-none');
            limitText.innerText = `${remaining.toFixed(2)} ${curr} Remaining Limit`;
            limitText.className = "fw-bold text-success";
            limitBar.className = "progress-bar bg-success";
            
            // Check Balance
            if (total > cardBal) {
                limitText.innerText = "Insufficient Wallet Balance";
                limitText.className = "fw-bold text-danger";
                submitBtn.disabled = true;
            } else {
                submitBtn.disabled = (amount <= 0);
            }
        }
    }
</script>
{% endblock %}
