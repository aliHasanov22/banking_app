{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow border-0">
            <div class="card-header bg-gradient-dark text-white text-center py-5" 
                 style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
                
                <div class="position-relative d-inline-block">
                    <img src="{{ url_for('static', filename='uploads/' + (user['profile_pic'] if user['profile_pic'] else 'default.png')) }}" 
                         class="rounded-circle border border-4 border-white shadow" 
                         width="140" height="140" style="object-fit: cover;">
                    
                    <button class="btn btn-sm btn-light position-absolute bottom-0 end-0 rounded-circle shadow" 
                            data-bs-toggle="modal" data-bs-target="#uploadModal">
                        <i class="fas fa-camera"></i>
                    </button>
                </div>
                <h3 class="mt-3">{{ user['name'] }}</h3>
                <p class="opacity-75">User ID: {{ user['account_id'] }}</p>
            </div>

            <div class="card-body p-4">
                <form method="POST">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="text-muted small">National ID</label>
                            <input type="text" class="form-control fw-bold" value="{{ user['id_card'] }}" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted small">Account Status</label>
                            <input type="text" class="form-control text-success fw-bold" value="Verified Active" disabled>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="text-muted small">Email Address</label>
                            <input type="email" name="email" class="form-control" value="{{ user['email'] }}">
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted small">Phone Number</label>
                            <input type="text" name="phone" class="form-control" value="{{ user['phone'] }}">
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5>Update Profile Picture</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <form method="POST" enctype="multipart/form-data">
                    <input type="file" name="profile_pic" class="form-control mb-3" required>
                    <button class="btn btn-success w-100">Upload New Photo</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
