<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEXO Bank</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --accent: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding-bottom: 80px; /* Space for bottom nav */
        }

        /* Smooth Card Styling */
        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Top Header */
        .top-bar {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Bottom Navigation Bar (Mobile Style) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
        }

        .nav-item-link {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            transition: color 0.3s;
        }

        .nav-item-link i {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

        .nav-item-link.active {
            color: var(--primary);
            font-weight: 600;
        }

        .nav-item-link:hover {
            color: #fff;
        }

        /* Action Button in Nav (The center circle) */
        .nav-action-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-top: -25px; /* Floats above the bar */
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
            border: 4px solid var(--bg-dark);
        }

        /* Alerts */
        .alert {
            border-radius: 12px;
            border: none;
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
        }
        .alert-success { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
        .alert-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }

    </style>
</head>
<body>

    <div class="top-bar d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 32px; height: 32px;">
                <i class="fas fa-bolt text-white"></i>
            </div>
            <span class="fw-bold fs-5 tracking-wide">NEXO</span>
        </div>
        
        <div class="d-flex align-items-center gap-3">
            <a href="#" class="text-muted"><i class="fas fa-bell"></i></a>
            <a href="{{ url_for('logout') }}" class="text-danger"><i class="fas fa-sign-out-alt"></i></a>
        </div>
    </div>

    <div class="container mt-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} d-flex align-items-center mb-4">
                        <i class="fas fa-info-circle me-2"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <div class="bottom-nav">
        <a href="{{ url_for('dashboard') }}" class="nav-item-link {{ 'active' if request.endpoint == 'dashboard' else '' }}">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>

        <a href="{{ url_for('cards') }}" class="nav-item-link {{ 'active' if request.endpoint == 'cards' else '' }}">
            <i class="fas fa-credit-card"></i>
            <span>Cards</span>
        </a>

        <a href="{{ url_for('transfer') }}" class="nav-action-btn">
            <i class="fas fa-paper-plane fa-lg"></i>
        </a>

        <a href="{{ url_for('exchange') }}" class="nav-item-link {{ 'active' if request.endpoint == 'exchange' else '' }}">
            <i class="fas fa-sync-alt"></i>
            <span>Swap</span>
        </a>

        <a href="#" class="nav-item-link">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
