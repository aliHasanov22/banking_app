{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-credit-card text-primary"></i> My Cards</h2>
    <a href="{{ url_for('order_card') }}" class="btn btn-dark rounded-pill px-4"><i class="fas fa-plus"></i> New Card</a>
</div>

<div class="row">
    {% for c in cards %}
    <div class="col-md-6 col-lg-4 mb-4">
        <div class="bank-card h-100 {{ 'bg-gradient-visa' if c['card_type'] == 'VISA' else 'bg-gradient-master' }}">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h5 class="mb-0">{{ c['card_name'] }}</h5>
                    <small class="opacity-75">{{ c['status'] }}</small>
                </div>
                <i class="fab fa-cc-{{ 'visa' if c['card_type'] == 'VISA' else 'mastercard' }} fa-2x"></i>
            </div>

            <div class="mt-4">
                <div class="card-chip"></div>
                <div class="card-number fs-5">{{ c['card_number'] }}</div>
            </div>

            <div class="mt-3">
                <small class="opacity-75">Available Balance</small>
                <div class="card-balance">{{ "%.2f"|format(c['balance']) }} {{ c['currency'] }}</div>
            </div>
            
            <div class="d-grid mt-3">
                <a href="{{ url_for('card_settings', card_num=c['card_number']) }}" class="btn btn-light text-dark btn-sm rounded-pill opacity-90">
                    <i class="fas fa-cog"></i> Settings
                </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
